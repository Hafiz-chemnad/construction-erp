<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works | Raje Construction</title>
    <!-- Note the ../../ because we are inside the modules/works folder now -->
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>

    <div class="header">
        <a href="../../index.html" style="color: white; text-decoration: none; float: left; font-size: 1.2rem;">&larr; Back</a>
        <h1>Raje Construction</h1>
        <h2 id="page-title">Loading Projects...</h2>
    </div>

    <div class="container">
        
        <div id="add-work-form" class="card" style="display: none; margin-bottom: 20px; border-left: 5px solid #3498db;">
            <h3 style="margin-top: 0;">Add New Project</h3>
            <input type="text" id="new_work_name" placeholder="Project Name (e.g., Paloth Road)" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
            <input type="number" id="new_work_deal" placeholder="Deal Amount (₹)" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            
            <div style="display: flex; gap: 10px;">
                <button id="btn-save-work" style="flex: 1; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Save Project</button>
                <button id="btn-cancel-work" style="flex: 1; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Cancel</button>
            </div>
        </div>

        <div class="grid-container" id="works-grid">
            <div class="card btn-add" id="add-work-btn">
                + Add New Work
            </div>
        </div>
    </div>

    <script type="module" src="works.js"></script>

</body>
</html>
